name: Compilar NutriXion APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Configurar Java 17 para Android
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Configurar Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: false

      - name: 5. Instalar Android SDK 35 y aceptar licencias
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: 6. Instalar Flet y preparar compilador
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 pyyaml

          cat << 'EOF' > /tmp/compilar_ci.py
          import os
          import sys
          import shutil
          import runpy
          import subprocess
          import yaml

          orig_run = subprocess.run

          def aplicar_parche_flutter(cwd):
              ruta_pub = os.path.join(cwd, "pubspec.yaml")
              if not cwd or not os.path.exists(ruta_pub):
                  return

              print(f"--> Ajustando compatibilidad Android en: {cwd}", flush=True)

              # 1. Fijar versiones exactas de plugins compatibles con Flutter 3.24.3
              try:
                  with open(ruta_pub, "r", encoding="utf-8") as f:
                      data = yaml.safe_load(f)
                  if isinstance(data, dict):
                      overrides = data.get("dependency_overrides") or {}
                      overrides["package_info_plus"] = "8.0.0"
                      overrides["wakelock_plus"] = "1.2.5"
                      overrides["file_picker"] = "8.0.5"
                      overrides["web"] = "1.0.0"
                      data["dependency_overrides"] = overrides
                      with open(ruta_pub, "w", encoding="utf-8") as f:
                          yaml.dump(data, f, default_flow_style=False, sort_keys=False)
              except Exception as e:
                  print(f"Aviso en pubspec.yaml: {e}", flush=True)

              # 2. Configurar compileSdk = 35 y targetSdk = 34 sin errores de sintaxis
              ruta_app_gradle = os.path.join(cwd, "android", "app", "build.gradle")
              if os.path.exists(ruta_app_gradle):
                  lineas = []
                  with open(ruta_app_gradle, "r", encoding="utf-8") as f:
                      for linea in f:
                          s = linea.strip()
                          if s.startswith("compileSdk ") or s.startswith("compileSdk=") or s.startswith("compileSdkVersion "):
                              lineas.append("    compileSdk = 35\n")
                          elif s.startswith("targetSdk ") or s.startswith("targetSdk=") or s.startswith("targetSdkVersion "):
                              lineas.append("    targetSdk = 34\n")
                          else:
                              lineas.append(linea)
                  with open(ruta_app_gradle, "w", encoding="utf-8") as f:
                      f.writelines(lineas)

              # 3. Fijar librerias AndroidX compatibles con AGP de Flet 0.24.1
              ruta_root_gradle = os.path.join(cwd, "android", "build.gradle")
              if os.path.exists(ruta_root_gradle):
                  with open(ruta_root_gradle, "r", encoding="utf-8") as f:
                      contenido = f.read()
                  bloque_androidx = """
          subprojects {
              project.configurations.all {
                  resolutionStrategy {
                      force "androidx.core:core:1.13.1"
                      force "androidx.core:core-ktx:1.13.1"
                      force "androidx.activity:activity:1.9.2"
                      force "androidx.activity:activity-ktx:1.9.2"
                      force "androidx.browser:browser:1.8.0"
                      force "androidx.lifecycle:lifecycle-common:2.8.4"
                      force "androidx.lifecycle:lifecycle-runtime:2.8.4"
                      force "androidx.lifecycle:lifecycle-viewmodel:2.8.4"
                  }
              }
          }
          """
                  if "androidx.core:core:1.13.1" not in contenido:
                      with open(ruta_root_gradle, "w", encoding="utf-8") as f:
                          f.write(contenido + "\n" + bloque_androidx)

          def hooked_run(*popenargs, **kwargs):
              cmd = popenargs[0] if popenargs else kwargs.get("args", [])
              cwd = kwargs.get("cwd")
              if isinstance(cmd, list) and len(cmd) > 0:
                  exe = os.path.basename(str(cmd[0]))
                  if exe in ("flutter", "dart") and cwd:
                      aplicar_parche_flutter(str(cwd))
              return orig_run(*popenargs, **kwargs)

          subprocess.run = hooked_run

          ruta_flet = shutil.which("flet")
          sys.argv = [
              ruta_flet, "build", "apk",
              "--project", "NutriXion",
              "--description", "Salud alimenticia",
              "--no-rich-output", "-vv"
          ]
          runpy.run_path(ruta_flet, run_name="__main__")
          EOF

      - name: 7. Compilar archivo .APK de NutriXion
        run: |
          python /tmp/compilar_ci.py

      - name: 8. Subir el APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NutriXion-Android-APK
          path: build/apk/*.apk