name: Compilar NutriXion APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Configurar Java 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 5. Aceptar licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 6. Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1

      - name: 7. Compilar archivo .APK de NutriXion
        run: |
          flet build apk --project "NutriXion" --description "Salud alimenticia" -v

      - name: 8. Subir el APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NutriXion-Android-APK
          path: build/apk/*.apk