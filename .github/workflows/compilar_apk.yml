name: Compilar NutriXion APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Configurar Java 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Configurar Flutter 3.29.2 (Con Dart 3.7 compatible)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: "stable"
          cache: false

      - name: 5. Instalar Android SDK 35 y aceptar licencias
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: 6. Instalar Flet y preparar parche automático de Gradle
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1

          cat << 'EOF' > /tmp/parche_android.py
          import os, re

          # 1. Fijar versiones estables de plugins en pubspec.yaml
          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  c = f.read()
              c = re.sub(r"package_info_plus:\s*\^?[\d\.]+", "package_info_plus: 8.0.2", c)
              c = re.sub(r"wakelock_plus:\s*\^?[\d\.]+", "wakelock_plus: 1.2.8", c)
              c = re.sub(r"file_picker:\s*\^?[\d\.]+", "file_picker: 8.0.6", c)
              if "file_picker: 8.0.6" not in c and "dependency_overrides:" in c:
                  c = c.replace("dependency_overrides:", "dependency_overrides:\n  file_picker: 8.0.6")
              with open("pubspec.yaml", "w", encoding="utf-8") as f:
                  f.write(c)

          # 2. Actualizar Gradle Wrapper a 8.9
          ruta_wrapper = "android/gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(ruta_wrapper):
              with open(ruta_wrapper, "r", encoding="utf-8") as f:
                  w = f.read()
              w = re.sub(r"gradle-[\d\.]+-(all|bin)\.zip", "gradle-8.9-all.zip", w)
              with open(ruta_wrapper, "w", encoding="utf-8") as f:
                  f.write(w)

          # 3. Asegurar AGP 8.6.0 y Kotlin 1.9.24 en android/settings.gradle
          if os.path.exists("android/settings.gradle"):
              with open("android/settings.gradle", "r", encoding="utf-8") as f:
                  s = f.read()
              s = re.sub(r'(id\s+["\']com\.android\.application["\']\s+version\s+)["\'][\d\.]+["\']', r'\g<1>"8.6.0"', s)
              s = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+)["\'][\d\.]+["\']', r'\g<1>"1.9.24"', s)
              with open("android/settings.gradle", "w", encoding="utf-8") as f:
                  f.write(s)

          # 4. Asegurar compileSdk 35 en android/app/build.gradle
          if os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r", encoding="utf-8") as f:
                  b = f.read()
              b = re.sub(r"compileSdkVersion\s+\S+", "compileSdkVersion 35", b)
              b = re.sub(r"compileSdk\s+\S+", "compileSdk 35", b)
              with open("android/app/build.gradle", "w", encoding="utf-8") as f:
                  f.write(b)

          # 5. Forzar librerías AndroidX compatibles en android/build.gradle
          if os.path.exists("android/build.gradle"):
              with open("android/build.gradle", "r", encoding="utf-8") as f:
                  ab = f.read()
              fix_androidx = """
          subprojects {
              project.configurations.all {
                  resolutionStrategy {
                      force "androidx.core:core:1.13.1"
                      force "androidx.core:core-ktx:1.13.1"
                      force "androidx.activity:activity:1.9.2"
                      force "androidx.activity:activity-ktx:1.9.2"
                      force "androidx.browser:browser:1.8.0"
                  }
              }
          }
          """
              if "androidx.core:core:1.13.1" not in ab:
                  ab = ab + "\n" + fix_androidx
              with open("android/build.gradle", "w", encoding="utf-8") as f:
                  f.write(ab)
          EOF

          FLUTTER_BIN=$(which flutter)
          mv "$FLUTTER_BIN" "${FLUTTER_BIN}_real"
          cat << 'EOF' > "$FLUTTER_BIN"
          #!/usr/bin/env bash
          REAL_FLUTTER="$(dirname "$0")/flutter_real"
          if [ "$1" = "build" ] && [ "$2" = "apk" ]; then
            echo "Aplicando parche de compatibilidad Android/Gradle en $PWD..."
            python3 /tmp/parche_android.py
            "$REAL_FLUTTER" pub get
          fi
          exec "$REAL_FLUTTER" "$@"
          EOF
          chmod +x "$FLUTTER_BIN"

      - name: 7. Compilar archivo .APK de NutriXion
        run: |
          flet build apk --project "NutriXion" --description "Salud alimenticia" -v

      - name: 8. Subir el APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NutriXion-Android-APK
          path: build/apk/*.apk