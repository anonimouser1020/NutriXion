name: Compilar NutriXion APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Configurar Java 17 para Android
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Configurar Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: false

      - name: 5. Instalar Android SDK 35 y aceptar licencias
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: 6. Instalar Flet y preparar icono oficial de NutriXion
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 pyyaml pillow

          cat << 'EOF' > /tmp/compilar_ci.py
          import os
          import sys
          import shutil
          import runpy
          import subprocess
          import yaml
          from PIL import Image

          # 1. Convertir logo.png en el icono oficial de Android (assets/icon.png)
          posibles_logos = [
              "logo.png", "logo.jpg", "logo.jpeg",
              "logo_nutrixion.png", "logo_nutrixion.jpg",
              "image_1.png", "watermarked_img_4370711781040816475.jpg"
          ]
          ruta_logo_encontrado = None
          for nombre in posibles_logos:
              if os.path.exists(nombre):
                  ruta_logo_encontrado = nombre
                  break

          os.makedirs("assets", exist_ok=True)

          if ruta_logo_encontrado:
              print(f"--> Procesando '{ruta_logo_encontrado}' como icono oficial de Android...", flush=True)
              img = Image.open(ruta_logo_encontrado).convert("RGBA")
              ancho, alto = img.size

              # Recortamos el cuadrado central para que el escudo circular no se deforme
              lado = min(ancho, alto)
              izq = (ancho - lado) // 2
              arr = (alto - lado) // 2
              img_cuadrada = img.crop((izq, arr, izq + lado, arr + lado))
              img_icono = img_cuadrada.resize((1024, 1024), Image.Resampling.LANCZOS)

              # Guardamos en todas las rutas que Flet y Android utilizan
              for destino in [
                  "assets/icon.png",
                  "assets/icon_android.png",
                  "assets/icon_ios.png",
                  "assets/splash.png",
                  "assets/splash_android.png",
                  "logo.png"
              ]:
                  img_icono.save(destino, format="PNG")
              print("--> Iconos generados correctamente en ./assets/", flush=True)
          else:
              print("ADVERTENCIA: No se encontro logo.png en el repositorio.", flush=True)

          orig_run = subprocess.run

          def aplicar_parche_flutter(cwd):
              ruta_pub = os.path.join(cwd, "pubspec.yaml")
              if not cwd or not os.path.exists(ruta_pub):
                  return

              print(f"--> Ajustando compatibilidad Android en: {cwd}", flush=True)

              # Sobrescribir cualquier icono por defecto dentro de la plantilla de Flutter
              if os.path.exists("assets/icon.png"):
                  carpeta_imgs = os.path.join(cwd, "images")
                  if os.path.exists(carpeta_imgs):
                      for arch in os.listdir(carpeta_imgs):
                          if arch.endswith(".png"):
                              shutil.copy2("assets/icon.png", os.path.join(carpeta_imgs, arch))

              # Fijar versiones compatibles de plugins en pubspec.yaml
              try:
                  with open(ruta_pub, "r", encoding="utf-8") as f:
                      data = yaml.safe_load(f)
                  if isinstance(data, dict):
                      overrides = data.get("dependency_overrides") or {}
                      overrides["package_info_plus"] = "8.0.0"
                      overrides["wakelock_plus"] = "1.2.5"
                      overrides["file_picker"] = "8.0.5"
                      overrides["web"] = "1.0.0"
                      data["dependency_overrides"] = overrides
                      with open(ruta_pub, "w", encoding="utf-8") as f:
                          yaml.dump(data, f, default_flow_style=False, sort_keys=False)
              except Exception as e:
                  print(f"Aviso en pubspec.yaml: {e}", flush=True)

              # Configurar compileSdk = 35 y targetSdk = 34
              ruta_app_gradle = os.path.join(cwd, "android", "app", "build.gradle")
              if os.path.exists(ruta_app_gradle):
                  lineas = []
                  with open(ruta_app_gradle, "r", encoding="utf-8") as f:
                      for linea in f:
                          s = linea.strip()
                          if s.startswith("compileSdk ") or s.startswith("compileSdk=") or s.startswith("compileSdkVersion "):
                              lineas.append("    compileSdk = 35\n")
                          elif s.startswith("targetSdk ") or s.startswith("targetSdk=") or s.startswith("targetSdkVersion "):
                              lineas.append("    targetSdk = 34\n")
                          else:
                              lineas.append(linea)
                  with open(ruta_app_gradle, "w", encoding="utf-8") as f:
                      f.writelines(lineas)

              # Fijar librerias AndroidX compatibles
              ruta_root_gradle = os.path.join(cwd, "android", "build.gradle")
              if os.path.exists(ruta_root_gradle):
                  with open(ruta_root_gradle, "r", encoding="utf-8") as f:
                      contenido = f.read()
                  bloque_androidx = """
          subprojects {
              project.configurations.all {
                  resolutionStrategy {
                      force "androidx.core:core:1.13.1"
                      force "androidx.core:core-ktx:1.13.1"
                      force "androidx.activity:activity:1.9.2"
                      force "androidx.activity:activity-ktx:1.9.2"
                      force "androidx.browser:browser:1.8.0"
                      force "androidx.lifecycle:lifecycle-common:2.8.4"
                      force "androidx.lifecycle:lifecycle-runtime:2.8.4"
                      force "androidx.lifecycle:lifecycle-viewmodel:2.8.4"
                  }
              }
          }
          """
                  if "androidx.core:core:1.13.1" not in contenido:
                      with open(ruta_root_gradle, "w", encoding="utf-8") as f:
                          f.write(contenido + "\n" + bloque_androidx)

          def hooked_run(*popenargs, **kwargs):
              cmd = popenargs[0] if popenargs else kwargs.get("args", [])
              cwd = kwargs.get("cwd")
              if isinstance(cmd, list) and len(cmd) > 0:
                  exe = os.path.basename(str(cmd[0]))
                  if exe in ("flutter", "dart") and cwd:
                      aplicar_parche_flutter(str(cwd))
              return orig_run(*popenargs, **kwargs)

          subprocess.run = hooked_run

          ruta_flet = shutil.which("flet")
          sys.argv = [
              ruta_flet, "build", "apk",
              "--project", "NutriXion",
              "--description", "Salud alimenticia",
              "--no-rich-output", "-vv"
          ]
          runpy.run_path(ruta_flet, run_name="__main__")
          EOF

      - name: 7. Compilar archivo .APK de NutriXion
        run: |
          python /tmp/compilar_ci.py

      - name: 8. Subir el APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NutriXion-Android-APK
          path: build/apk/*.apk