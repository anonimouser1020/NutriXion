name: Compilar NutriXion APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Configurar Java 17 para Android
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Configurar Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: false

      - name: 5. Instalar Android SDK 35 y aceptar licencias
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: 6. Instalar Flet y preparar compilador con Camara Directa
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 pyyaml pillow

          cat << 'EOF' > /tmp/compilar_ci.py
          import os
          import re
          import sys
          import shutil
          import runpy
          import subprocess
          import yaml
          from PIL import Image

          # 1. Convertir logo.png en el icono oficial de Android (assets/icon.png)
          posibles_logos = [
              "logo.png", "logo.jpg", "logo.jpeg",
              "logo_nutrixion.png", "logo_nutrixion.jpg",
              "image_1.png", "watermarked_img_4370711781040816475.jpg"
          ]
          ruta_logo_encontrado = None
          for nombre in posibles_logos:
              if os.path.exists(nombre):
                  ruta_logo_encontrado = nombre
                  break

          os.makedirs("assets", exist_ok=True)

          if ruta_logo_encontrado:
              print(f"--> Procesando '{ruta_logo_encontrado}' como icono oficial de Android...", flush=True)
              img = Image.open(ruta_logo_encontrado).convert("RGBA")
              ancho, alto = img.size
              lado = min(ancho, alto)
              izq = (ancho - lado) // 2
              arr = (alto - lado) // 2
              img_cuadrada = img.crop((izq, arr, izq + lado, arr + lado))
              img_icono = img_cuadrada.resize((1024, 1024), Image.Resampling.LANCZOS)

              for destino in [
                  "assets/icon.png",
                  "assets/icon_android.png",
                  "assets/icon_ios.png",
                  "assets/splash.png",
                  "assets/splash_android.png",
                  "logo.png"
              ]:
                  img_icono.save(destino, format="PNG")

          orig_run = subprocess.run

          def inyectar_camara_directa_java():
              rutas_encontradas = []
              for base_dir in ["/opt/hostedtoolcache", "/home/runner", "/root", "/tmp"]:
                  if not os.path.exists(base_dir):
                      continue
                  for raiz, _, archivos in os.walk(base_dir):
                      if "FilePickerDelegate.java" in archivos:
                          rutas_encontradas.append(os.path.join(raiz, "FilePickerDelegate.java"))

              for ruta_java in rutas_encontradas:
                  with open(ruta_java, "r", encoding="utf-8") as f:
                      codigo = f.read()

                  if "ACTION_IMAGE_CAPTURE" in codigo:
                      continue

                  bloque_lanzar_camara = """private void startFileExplorer() {
                      if ("video/*".equals(this.type) || "custom".equals(this.type)) {
                          try {
                              android.content.Intent camIntent = new android.content.Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE);
                              this.activity.startActivityForResult(camIntent, REQUEST_CODE);
                          } catch (Exception e) {
                              e.printStackTrace();
                              finishWithError("camera_error", e.getMessage());
                          }
                          return;
                      }"""

                  bloque_recibir_foto = """if (requestCode == REQUEST_CODE && resultCode == Activity.RESULT_OK) {
                      if ("video/*".equals(this.type) || "custom".equals(this.type)) {
                          try {
                              java.io.File outFile = new java.io.File(this.activity.getCacheDir(), "captura_" + System.currentTimeMillis() + ".jpg");
                              boolean guardado = false;
                              if (data != null && data.getExtras() != null && data.getExtras().get("data") instanceof android.graphics.Bitmap) {
                                  android.graphics.Bitmap bmp = (android.graphics.Bitmap) data.getExtras().get("data");
                                  java.io.FileOutputStream fos = new java.io.FileOutputStream(outFile);
                                  bmp.compress(android.graphics.Bitmap.CompressFormat.JPEG, 95, fos);
                                  fos.flush();
                                  fos.close();
                                  guardado = true;
                              } else if (data != null && data.getData() != null) {
                                  java.io.InputStream is = this.activity.getContentResolver().openInputStream(data.getData());
                                  if (is != null) {
                                      java.io.FileOutputStream fos = new java.io.FileOutputStream(outFile);
                                      byte[] buffer = new byte[8192];
                                      int leidos;
                                      while ((leidos = is.read(buffer)) != -1) {
                                          fos.write(buffer, 0, leidos);
                                      }
                                      fos.flush();
                                      fos.close();
                                      is.close();
                                      guardado = true;
                                  }
                              }
                              if (guardado) {
                                  final ArrayList<FileInfo> camFiles = new ArrayList<>();
                                  final FileInfo camInfo = new FileInfo.Builder()
                                      .withPath(outFile.getAbsolutePath())
                                      .withName(outFile.getName())
                                      .withUri(android.net.Uri.fromFile(outFile))
                                      .withSize(outFile.length())
                                      .build();
                                  camFiles.add(camInfo);
                                  finishWithSuccess(camFiles);
                                  return true;
                              }
                          } catch (Exception e) {
                              e.printStackTrace();
                              finishWithError("camera_error", e.getMessage());
                              return true;
                          }
                      }"""

                  codigo = codigo.replace("private void startFileExplorer() {", bloque_lanzar_camara, 1)
                  codigo = codigo.replace("if (requestCode == REQUEST_CODE && resultCode == Activity.RESULT_OK) {", bloque_recibir_foto, 1)

                  with open(ruta_java, "w", encoding="utf-8") as f:
                      f.write(codigo)
                  print(f"--> EXITO: Camara directa inyectada en: {ruta_java}", flush=True)

          def aplicar_parche_flutter(cwd):
              ruta_pub = os.path.join(cwd, "pubspec.yaml")
              if not cwd or not os.path.exists(ruta_pub):
                  return

              print(f"--> Ajustando compatibilidad Android en: {cwd}", flush=True)

              if os.path.exists("assets/icon.png"):
                  carpeta_imgs = os.path.join(cwd, "images")
                  if os.path.exists(carpeta_imgs):
                      for arch in os.listdir(carpeta_imgs):
                          if arch.endswith(".png"):
                              shutil.copy2("assets/icon.png", os.path.join(carpeta_imgs, arch))

              # 1. Fijar nombre "NutriXion" y habilitar intent de camara sin bloqueo de permisos
              ruta_manifest = os.path.join(cwd, "android", "app", "src", "main", "AndroidManifest.xml")
              if os.path.exists(ruta_manifest):
                  with open(ruta_manifest, "r", encoding="utf-8") as f:
                      m = f.read()
                  m = re.sub(r'android:label="[^"]*"', 'android:label="NutriXion"', m)
                  m = re.sub(r'<uses-permission[^>]*android\.permission\.CAMERA[^>]*/>', '', m)
                  if "android.media.action.IMAGE_CAPTURE" not in m and "<queries>" in m:
                      m = m.replace("<queries>", '<queries>\n        <intent>\n            <action android:name="android.media.action.IMAGE_CAPTURE" />\n        </intent>')
                  with open(ruta_manifest, "w", encoding="utf-8") as f:
                      f.write(m)

              # 2. Fijar versiones compatibles de plugins en pubspec.yaml
              try:
                  with open(ruta_pub, "r", encoding="utf-8") as f:
                      data = yaml.safe_load(f)
                  if isinstance(data, dict):
                      overrides = data.get("dependency_overrides") or {}
                      overrides["package_info_plus"] = "8.0.0"
                      overrides["wakelock_plus"] = "1.2.5"
                      overrides["file_picker"] = "8.0.5"
                      overrides["web"] = "1.0.0"
                      data["dependency_overrides"] = overrides
                      with open(ruta_pub, "w", encoding="utf-8") as f:
                          yaml.dump(data, f, default_flow_style=False, sort_keys=False)
              except Exception as e:
                  print(f"Aviso en pubspec.yaml: {e}", flush=True)

              # 3. Configurar compileSdk = 35 y targetSdk = 34
              ruta_app_gradle = os.path.join(cwd, "android", "app", "build.gradle")
              if os.path.exists(ruta_app_gradle):
                  lineas = []
                  with open(ruta_app_gradle, "r", encoding="utf-8") as f:
                      for linea in f:
                          s = linea.strip()
                          if s.startswith("compileSdk ") or s.startswith("compileSdk=") or s.startswith("compileSdkVersion "):
                              lineas.append("    compileSdk = 35\n")
                          elif s.startswith("targetSdk ") or s.startswith("targetSdk=") or s.startswith("targetSdkVersion "):
                              lineas.append("    targetSdk = 34\n")
                          else:
                              lineas.append(linea)
                  with open(ruta_app_gradle, "w", encoding="utf-8") as f:
                      f.writelines(lineas)

              # 4. Fijar librerias AndroidX compatibles
              ruta_root_gradle = os.path.join(cwd, "android", "build.gradle")
              if os.path.exists(ruta_root_gradle):
                  with open(ruta_root_gradle, "r", encoding="utf-8") as f:
                      contenido = f.read()
                  bloque_androidx = """
          subprojects {
              project.configurations.all {
                  resolutionStrategy {
                      force "androidx.core:core:1.13.1"
                      force "androidx.core:core-ktx:1.13.1"
                      force "androidx.activity:activity:1.9.2"
                      force "androidx.activity:activity-ktx:1.9.2"
                      force "androidx.browser:browser:1.8.0"
                      force "androidx.lifecycle:lifecycle-common:2.8.4"
                      force "androidx.lifecycle:lifecycle-runtime:2.8.4"
                      force "androidx.lifecycle:lifecycle-viewmodel:2.8.4"
                  }
              }
          }
          """
                  if "androidx.core:core:1.13.1" not in contenido:
                      with open(ruta_root_gradle, "w", encoding="utf-8") as f:
                          f.write(contenido + "\n" + bloque_androidx)

              # 5. Descargar paquetes en cache global e inyectar camara directa
              orig_run(["flutter", "pub", "get"], cwd=cwd)
              inyectar_camara_directa_java()

          def hooked_run(*popenargs, **kwargs):
              cmd = popenargs[0] if popenargs else kwargs.get("args", [])
              cwd = kwargs.get("cwd")
              if isinstance(cmd, list) and len(cmd) > 0:
                  exe = os.path.basename(str(cmd[0]))
                  if exe in ("flutter", "dart") and cwd:
                      aplicar_parche_flutter(str(cwd))
              return orig_run(*popenargs, **kwargs)

          subprocess.run = hooked_run

          ruta_flet = shutil.which("flet")
          sys.argv = [
              ruta_flet, "build", "apk",
              "--project", "NutriXion",
              "--product", "NutriXion",
              "--description", "Salud alimenticia",
              "--no-rich-output", "-vv"
          ]
          runpy.run_path(ruta_flet, run_name="__main__")
          EOF

      - name: 7. Compilar archivo .APK de NutriXion
        run: |
          python /tmp/compilar_ci.py

      - name: 8. Subir el APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NutriXion-Android-APK
          path: build/apk/*.apk